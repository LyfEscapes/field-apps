<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3a45">
<title>Drain Keeper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: plain-spoken public-works tool an HOA board or a two-person town crew can run
   IDEA: the drainage plat a county engineer marks up, every pipe a photo point you can return to exactly
   PICTURE: the neighborhood drainage map, then each asset's own photo history lined up frame for frame
   COLOUR and TYPE: storm-water teal, white ground, a five-step condition scale ending in red; Public Sans
   LAYOUT: one app column, bottom tabs, asset pages, full-screen SiteLock camera */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1417);--card:light-dark(#eef4f4,#132125);--ink:light-dark(#0b2a33,#e4f0f1);--mute:light-dark(#4f6970,#97b1b6);--line:light-dark(#d3e2e3,#24393e);--tl:#0e7c86;--water:light-dark(#9fd3dc,#1d5966);--road:light-dark(#d9dcdc,#2c3436);--lot:light-dark(#f3f5f1,#111c1f);--house:light-dark(#c9cfc9,#33403f);--grass:light-dark(#e3eedf,#132017)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif;overflow-x:clip}
header{background:#0b3a45;color:#e8f6f7;padding:20px max(5vw,16px) 22px}
header .in,main{max-width:760px;margin:0 auto}
h1{font-size:38px;line-height:1.05;margin:2px 0 4px;font-weight:800}h2{font-size:22px;line-height:1.15;margin:0 0 6px;font-weight:800}
header small{font-size:14px;opacity:.85}
main{padding:16px max(4vw,14px) 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mute{color:var(--mute);font-size:14px}
.big{font-size:clamp(32px,8.5vw,48px);font-weight:800;line-height:1;white-space:nowrap}
button,.btn{font:600 16px "Public Sans",system-ui,sans-serif;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pri{background:var(--tl)!important;border-color:var(--tl)!important;color:#fff!important}
button.ghost{background:none;border:0;color:var(--tl);padding:10px 4px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
input,select,textarea{font:16px "Public Sans",system-ui,sans-serif;width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.stage{overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--grass)}
.stage svg{display:block;height:auto}
#lmap{height:460px;border-radius:14px;border:1px solid var(--line);position:relative;z-index:0;isolation:isolate}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin-top:8px}.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.as{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-weight:400;background:none;border-radius:0;border-left:0;border-right:0;border-bottom:0}
.as img,.noimg{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--line);display:block}
.cn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;background:var(--bg);border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap}
.seg5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.seg5 button{padding:6px 0;font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}.seg button{padding:8px 4px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags button{min-height:38px;padding:6px 10px;font-size:14px;font-weight:400}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;margin:6px 0;font-size:14px}.bar div{height:16px;border-radius:4px}.bar b{text-align:right}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.chk input{width:26px;min-height:26px}
.hero{border-radius:14px;overflow:hidden;background:#111}.hero canvas{display:block;width:100%;height:auto}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;margin:10px 0 0}.facts dt{color:var(--mute)}.facts dd{margin:0;overflow-wrap:anywhere}
.badge{display:inline-flex;gap:6px;align-items:center;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--line)}.badge.ok{background:#0e7c5f;color:#fff;border-color:#0e7c5f}
.mstage{overflow:auto;border-radius:14px;background:#111;max-height:62vh}.mstage canvas{display:block;width:100%;max-width:none;cursor:crosshair;touch-action:none}
.print{background:#fff;border-radius:10px;padding:8px}.print svg{width:100%;height:auto;display:block}
.tagsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:700}.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.hint{background:var(--tl);color:#fff;border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:light-dark(rgba(255,255,255,.95),rgba(11,20,23,.95));border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:500}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{border:0;border-radius:0;background:none;font-size:13px;min-height:56px;color:var(--mute);padding:8px 2px}
nav button[aria-current=true]{color:var(--tl);box-shadow:inset 0 3px 0 var(--tl);background:none}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0b3a45;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:1100;max-width:90vw}#toast.on{opacity:1}
.loading{display:grid;place-items:center;min-height:40vh;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><div class="in"><small>LyfEscapes · drainage inventory for HOAs and small towns</small><h1>Drain Keeper</h1><small>Photos and records stay on this phone.</small></div></header>
<main id="view"><div class="loading">Setting up the sample neighborhood…</div></main>
<nav><div class="in" id="tabs"><button data-v="map">Map</button><button data-v="assets">Assets</button><button data-v="storm">Storm</button><button data-v="compare">Compare</button><button data-v="report">Report</button></div></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script src="vendor/cv.js"></script>
<script src="vendor/aruco.js"></script>
<script src="sitelock.js"></script>
<script>
{
const SL=window.SiteLock,APP='drainkeeper',store=new SL.Store(APP);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COND=[null,['Good','#0e7c86'],['Fair','#5d9e74'],['Worn','#c99400'],['Poor','#e0621b'],['Failed','#c81e1e']];
const TYPES={inlet:'Inlet / catch basin',culvert:'Pipe or culvert',ditch:'Ditch or swale',outfall:'Outfall / headwall',pond:'Detention pond',structure:'Pond outlet structure'};
const PFX={inlet:'INL',culvert:'CUL',ditch:'DIT',outfall:'OUT',pond:'PND',structure:'OCS'};
const ISSUES=['Sediment','Debris','Vegetation','Erosion','Standing water','Crushed or bent','Joint separation','Sinkhole nearby','Trash rack clogged'];
const OWN=['HOA','County','Town','State DOT','Private lot','Unknown'];
const MLABEL=['Sediment depth','Pipe opening','Scour depth','Crack width','Other'];
const OTHER=[['crackwatch','Crack Watch'],['trenchcheck','Trench Check'],['digclear','DigClear'],['cylinderchain','Cylinder Chain'],['corefield','CoreField']];
const NOW=new Date(),D=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return d};
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const fmt=d=>new Date(String(d).length===10?d+'T12:00':d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const inch=mm=>SL.len(mm,'in');
// schematic map units <-> GPS (sample neighborhood ≈ 300 m across)
const G0=()=>meta.g0||{lat:35.0012,lon:-81.0015},toGeo=(x,y)=>({lat:G0().lat-y*2.7e-6,lon:G0().lon+x*3.29e-6}),toXY=g=>({x:(g.lon-G0().lon)/3.29e-6,y:(G0().lat-g.lat)/2.7e-6});
let assets=[],floods=[],caps=new Map(),meta={hoa:'Ridgeview Commons HOA',forecast:{inches:2.5,date:iso(D(3))},route:{}};
let view='map',cur=null,mode=null,zoom=1,filt='all',insp=null,meas=null,cmp=null,me=null,mapKind='plan',tilesOK=false,lmap=null;
const imgCache=new Map();const getImg=async x=>{const id=typeof x==='string'?x:x?.id;if(imgCache.has(id))return imgCache.get(id);const c=typeof x==='object'&&x?x:caps.get(id);if(!c)return null;const im=await SL.img(c.img);imgCache.set(id,im);return im};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)}
function copy(t,m){try{navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('Copy was blocked here'))}catch(e){toast('Copy was blocked here')}}
function sheet(html,mount){const sh=$('#sheet');sh.onclick=null;sh.onchange=null;sh.innerHTML=html;$('#scrim').classList.add('on');mount&&mount(sh)}
const closeSheet=()=>$('#scrim').classList.remove('on');
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});

/* ---------- sample scenes: stand-ins for real field photos ---------- */
const WW=1440,WH=1080;
const svgImg=async svg=>SL.img('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
async function scene(type,o){
  const c=document.createElement('canvas');c.width=WW;c.height=WH;const g=c.getContext('2d');let s=o.seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const grass=(x,y,w,h)=>{g.fillStyle='#5f7d3c';g.fillRect(x,y,w,h);for(let i=0;i<w*h/90;i++){const v=r();g.strokeStyle=`rgba(${40+v*70|0},${85+v*80|0},${30+v*30|0},.7)`;g.lineWidth=2;const px=x+r()*w,py=y+r()*h;g.beginPath();g.moveTo(px,py);g.lineTo(px+(r()-.5)*8,py-6-r()*12);g.stroke()}};
  const conc=(x,y,w,h,base=168)=>{g.fillStyle=`rgb(${base},${base-4},${base-12})`;g.fillRect(x,y,w,h);for(let i=0;i<w*h/120;i++){const v=base-40+r()*80|0;g.fillStyle=`rgba(${v},${v-3},${v-8},.5)`;g.fillRect(x+r()*w,y+r()*h,1+r()*3,1+r()*3)}g.fillStyle='rgba(60,50,40,.12)';for(let i=0;i<6;i++){g.beginPath();g.ellipse(x+r()*w,y+r()*h,30+r()*90,12+r()*40,r(),0,7);g.fill()}};
  const debris=(cx,cy,rad,n)=>{for(let i=0;i<n;i++){const a=r()*7,d=r()*rad;g.fillStyle=['#7a4a1f','#9b6a2c','#5c3a17','#b08540'][i%4];g.beginPath();g.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.6,6+r()*10,3+r()*5,r()*3,0,7);g.fill()}for(let i=0;i<n/8;i++){g.strokeStyle='#4a3420';g.lineWidth=4+r()*4;const x=cx+(r()-.5)*rad*2,y=cy+(r()-.5)*rad;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-.5)*160,y+(r()-.5)*50);g.stroke()}};
  if(type==='culvert'||type==='outfall'){
    grass(0,0,WW,WH);const hx=240,hy=250,hw=960,hh=520;conc(hx,hy,hw,hh,o.dark?150:172);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(hx,hy+hh-14,hw,14);
    const cx=720,cy=560,R=type==='culvert'?205:170;g.fillStyle='#8e8a82';g.beginPath();g.arc(cx,cy,R+22,0,7);g.fill();const rg=g.createRadialGradient(cx,cy,10,cx,cy,R);rg.addColorStop(0,'#050505');rg.addColorStop(1,'#2a2724');g.fillStyle=rg;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();
    if(o.block){const yb=cy+R-2*R*o.block/100;g.save();g.beginPath();g.arc(cx,cy,R,0,7);g.clip();g.fillStyle='#7b5a35';g.fillRect(cx-R,yb,2*R,cy+R-yb);for(let i=0;i<400;i++){g.fillStyle=`rgba(${90+r()*60|0},${60+r()*40|0},30,.6)`;g.fillRect(cx-R+r()*2*R,yb+r()*(cy+R-yb),3,2)}g.restore();debris(cx,yb,R*.8,Math.round(o.block/2))}
    g.fillStyle='#b9b4aa';g.fillRect(hx+40,hy+hh,hw-80,90);for(let i=0;i<70;i++){const x=hx+r()*hw,y=hy+hh+90+r()*200;g.fillStyle=`rgb(${120+r()*60|0},${118+r()*55|0},${110+r()*50|0})`;g.beginPath();g.moveTo(x,y);for(let k=0;k<6;k++)g.lineTo(x+Math.cos(k)*(18+r()*22),y+Math.sin(k)*(12+r()*16));g.fill()}
    if(o.erosion){g.fillStyle='rgba(70,45,25,.85)';g.beginPath();g.ellipse(cx+40,hy+hh+150,180*o.erosion+40,60*o.erosion+15,0,0,7);g.fill();g.fillStyle='rgba(40,25,12,.6)';g.beginPath();g.ellipse(cx+40,hy+hh+140,120*o.erosion,35*o.erosion,0,0,7);g.fill()}
    g.fillStyle='rgba(120,160,175,.55)';g.beginPath();g.ellipse(cx,hy+hh+60,R*.9,26,0,0,7);g.fill();
    if(o.board!=null){const b=await svgImg(SL.Card.svg(o.board,'DRAIN KEEPER'));g.save();g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=12;g.drawImage(b,hx+40,hy+290,279.4*.672,215.9*.672);g.restore()}
    if(o.tag){const t=await svgImg(SL.Card.tagSVG(o.tag,'Drain Keeper'));g.drawImage(t,hx+hw-150,hy+40,30*3,38*3)}
  }else if(type==='inlet'){
    g.fillStyle='#3a3d40';g.fillRect(0,0,WW,WH);for(let i=0;i<9000;i++){const v=40+r()*50|0;g.fillStyle=`rgb(${v},${v},${v+3})`;g.fillRect(r()*WW,r()*WH,2,2)}
    conc(0,700,WW,380,182);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,700,WW,16);grass(0,900,WW,180);
    const gx=420,gy=420,gw=600,gh=280;g.fillStyle='#1b1b1c';g.fillRect(gx-16,gy-16,gw+32,gh+32);g.fillStyle='#4b4d50';g.fillRect(gx,gy,gw,gh);g.fillStyle='#0c0c0c';for(let i=0;i<12;i++)g.fillRect(gx+20+i*48,gy+18,24,gh-36);
    if(o.block)debris(gx+gw/2,gy+gh/2,gw*.55*Math.sqrt(o.block/100),Math.round(o.block*2.2));
    if(o.board!=null){const b=await svgImg(SL.Card.svg(o.board,'DRAIN KEEPER'));g.drawImage(b,80,380,279.4*.9,215.9*.9)}
  }else if(type==='ditch'){
    grass(0,0,WW,WH);g.fillStyle='#6b5233';g.beginPath();g.moveTo(560,0);g.lineTo(880,0);g.lineTo(980,WH);g.lineTo(460,WH);g.fill();g.fillStyle='rgba(110,150,165,.8)';g.beginPath();g.moveTo(690,0);g.lineTo(760,0);g.lineTo(790,WH);g.lineTo(650,WH);g.fill();
    for(let i=0;i<(o.veg||0)*160;i++){const x=480+r()*480,y=r()*WH;g.strokeStyle='#3f6a26';g.lineWidth=3;for(let k=0;k<5;k++){g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-.5)*30,y-20-r()*30);g.stroke()}}
    if(o.erosion){g.fillStyle='rgba(120,80,45,.9)';for(let i=0;i<5;i++){g.beginPath();g.ellipse(520+r()*80,150+i*190,40+90*o.erosion,25+30*o.erosion,.3,0,7);g.fill()}}
    if(o.block)debris(720,540,200,Math.round(o.block*1.5));
  }else{
    grass(0,0,WW,420);const wg=g.createLinearGradient(0,380,0,WH);wg.addColorStop(0,'#5d8a93');wg.addColorStop(1,'#2f5560');g.fillStyle=wg;g.fillRect(0,380,WW,WH-380);for(let i=0;i<200;i++){g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;const x=r()*WW,y=400+r()*680;g.beginPath();g.moveTo(x,y);g.lineTo(x+20+r()*40,y);g.stroke()}
    if(type==='structure'){conc(560,240,320,520,170);g.fillStyle='#111';g.fillRect(600,300,240,260);g.fillStyle='#6a6a6a';for(let i=0;i<9;i++)g.fillRect(606+i*27,300,8,260);if(o.block)debris(720,470,130,Math.round(o.block*1.6))}
    else if(o.block){g.fillStyle='rgba(120,95,55,.75)';g.beginPath();g.ellipse(720,700,300*o.block/60,110*o.block/60,0,0,7);g.fill()}
    if(o.veg){for(let i=0;i<o.veg*120;i++){const x=r()*WW,y=380+r()*90;g.strokeStyle='#3f6a26';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-.5)*20,y-40-r()*40);g.stroke()}}
    if(o.tag){const t=await svgImg(SL.Card.tagSVG(o.tag,'Drain Keeper'));g.drawImage(t,610,250,60,76)}
  }
  return c;
}
function shoot(w,t){const c=document.createElement('canvas');c.width=1200;c.height=900;const g=c.getContext('2d');g.fillStyle='#222';g.fillRect(0,0,1200,900);g.save();g.translate(600+t.dx*1200,450+t.dy*1200);g.rotate(t.rot*Math.PI/180);g.scale(t.scale,t.scale);g.translate(-WW/2,-WH/2);g.drawImage(w,0,0);g.restore();return c}
async function tagCloseup(id){const c=document.createElement('canvas');c.width=1200;c.height=900;const g=c.getContext('2d');let s=id*7;const r=()=>(s=(s*16807)%2147483647)/2147483647;g.fillStyle='#a9a49b';g.fillRect(0,0,1200,900);for(let i=0;i<12000;i++){const v=120+r()*80|0;g.fillStyle=`rgba(${v},${v-3},${v-9},.5)`;g.fillRect(r()*1200,r()*900,2,2)}const t=await svgImg(SL.Card.tagSVG(id,'Drain Keeper'));g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=10;g.drawImage(t,420,170,30*12,38*12);g.restore();return c}

/* ---------- sample data ---------- */
const SAMPLES=[
 ['culvert',1,'24 in RCP under Ridgeview Dr at the creek',600,425,'County',true,{size:'24 in',mat:'Reinforced concrete'},[[200,1,10,[],{}],[120,3,25,['Sediment'],{}],[9,4,50,['Sediment','Debris'],{}]],{board:40}],
 ['culvert',2,'Driveway culvert, lot 14',318,262,'Private lot',false,{size:'15 in',mat:'Corrugated metal'},[[200,5,75,['Crushed or bent'],{dark:1}]],{}],
 ['inlet',1,'Curb inlet, Ridgeview Dr at Laurel Ct',420,300,'HOA',false,{},[[90,2,0,[],{}]],{}],
 ['inlet',2,'Curb inlet, 112 Ridgeview Dr',220,298,'HOA',false,{},[[420,3,25,['Debris'],{}]],{}],
 ['inlet',3,'Curb inlet, 140 Ridgeview Dr',780,330,'HOA',false,{},[[90,1,0,[],{}]],{}],
 ['inlet',4,'Yard inlet behind lot 23',470,560,'Unknown',true,{},[[500,3,25,['Sediment'],{}],[30,4,50,['Sediment','Standing water'],{}]],{}],

/* ---------- render & events ---------- */
let mapScroll=null;
function render(){if(!started){$('#view').innerHTML=`<div style="display:grid;gap:12px;padding:8px 0"><h2>Welcome to Drain Keeper</h2><p style="margin:0">Map every pipe, inlet, ditch and pond, give each one a photo point you can return to exactly, and hand the board a condition report that says whose problem each one is.</p><label for="hoaname">Your HOA or town</label><input id="hoaname" placeholder="Ridgeview Commons HOA"><button class="pri" data-act="fresh">Start my inventory</button><button data-act="sample">Explore with a sample neighborhood</button><p class="mute">Everything stays on this phone. <a href="privacy.html">Privacy</a></p></div>`;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current','false'));return}const st0=$('#stage');if(st0)mapScroll=[st0.scrollLeft,st0.scrollTop];
  $('#view').innerHTML=view==='map'?vMap():view==='assets'?vAssets():view==='storm'?vStorm():view==='compare'?vCompare():view==='report'?vReport():view==='asset'?vAsset():view==='inspect'?vInspect():view==='measure'?vMeasure():'';
  const tab={asset:'assets',inspect:'assets',measure:'assets'}[view]||view;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===tab));
  const st=$('#stage');if(st){if(mapScroll){st.scrollLeft=mapScroll[0];st.scrollTop=mapScroll[1]}else st.scrollLeft=(st.scrollWidth-st.clientWidth)*.6}
  if(view==='map'&&mapKind==='gps')mountLeaflet();
  if(view==='asset'){const a=assets.find(x=>x.id===cur),C=a&&capsOf(a),last=C&&C[C.length-1];if(last)paintPhoto($('#hero'),last,a,(a.hist.find(h=>h.cap===last.id)||{}).meas)}
  if(view==='inspect')mountInspect();
  if(view==='measure'){paintMeasure().then(focusGauge);bindMeasure()}
  if(view==='compare')mountCompare();
  if(view==='report')findOthers();
  try{history.replaceState(null,'',view==='asset'?'#asset-'+cur:['map','assets','storm','compare','report'].includes(view)?'#'+view:location.pathname)}catch(e){}}
async function findOthers(){const e=$('#found');if(!e)return;const o=(await store.all('spots')).filter(x=>x.app!==APP);e.textContent=o.length?`${o.length} record${o.length>1?'s':''} from your other apps on this device.`:'Your other LyfEscapes apps show up here once they share this web address or install on this phone.'}
document.addEventListener('click',async e=>{if(e.target.closest('#sheet')||e.target.closest('.sl-root'))return;
  const svg=e.target.closest('#dmap');if(svg&&mode){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse()),m=mode;mode=null;render();m==='add'?newAssetSheet(q.x,q.y):floodSheet(q.x,q.y);return}
  const g=e.target.closest('[data-asset]');if(g){openAsset(g.dataset.asset);return}
  const fl=e.target.closest('[data-flood]');if(fl){const f=floods.find(x=>x.id===fl.dataset.flood);f&&toast(`${fmt(f.date)}: ${f.depth}`);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v){if(!started)return;view=b.dataset.v;mode=null;render();scrollTo(0,0);return}
  if(b.dataset.z){zoom=Math.min(2.5,Math.max(1,zoom+ +b.dataset.z*.5));render();return}
  if(b.dataset.mk){mapKind=b.dataset.mk;render();return}
  if(b.dataset.cam){inspectCam(assets.find(a=>a.id===b.dataset.cam));return}
  if(b.dataset.c&&insp){insp.cond=+b.dataset.c;insp.note=$('#inote')?.value||insp.note;const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.b&&insp){insp.block=+b.dataset.b;insp.note=$('#inote')?.value||insp.note;const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.i&&insp){const i=b.dataset.i;insp.issues=insp.issues.includes(i)?insp.issues.filter(x=>x!==i):[...insp.issues,i];insp.note=$('#inote')?.value||insp.note;const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.mz){meas.zoom=Math.min(4,Math.max(1,meas.zoom+ +b.dataset.mz));render();return}
  if(b.dataset.mode){cmp.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));cmp.api&&cmp.api.set('mode',cmp.mode);return}
  if(b.dataset.unlink!=null){const a=assets.find(x=>x.id===cur);a.links.splice(+b.dataset.unlink,1);await saveA(a);render();return}
  const act=b.dataset.act,a=assets.find(x=>x.id===cur);
  if(act==='fresh'){meta.hoa=$('#hoaname')?.value.trim()||'My neighborhood';await saveMeta();await store.put('kv',{k:'dk-started',v:1});started=true;view='map';render();return}
  if(act==='sample'){$('#view').innerHTML='<div class="loading">Setting up the sample neighborhood…</div>';await seed();await load();started=true;view='map';render();return}
  if(!started)return;
  if(act==='addmode'){if(me){newAssetSheet(toXY(me).x,toXY(me).y);return}mode='add';view='map';render()}
  if(act==='floodmode'){if(me){floodSheet(toXY(me).x,toXY(me).y);return}mode='flood';view='map';render();scrollTo(0,0)}
  if(act==='cancelmode'){mode=null;render()}
  if(act==='scantag')scanTag();
  if(act==='back'){view='assets';render()}
  if(act==='inspectcam')inspectCam(a);
  if(act==='inspectquick')startInspect(a,null);
  if(act==='cmpasset'){cmp={asset:a.id,a:null};const C=capsOf(a);cmp={asset:a.id,a:C[0].id,b:C[C.length-1].id,mode:'swipe',grid:true};view='compare';render();scrollTo(0,0)}
  if(act==='assigntag'){const used=new Set(assets.map(x=>x.tag));const id=[...Array(49).keys()].map(i=>201+i).find(i=>!used.has(i));a.tag=id;await saveA(a);render();toast(`Tag ${id} assigned. Print it from Report`)}
  if(act==='link'){const id=$('#li').value.trim();if(!id){toast('Add the record ID');return}a.links=a.links||[];a.links.push({app:$('#la').value,id,label:$('#ll').value.trim()});await saveA(a);render();toast('Linked')}
  if(act==='copyrec')copy(SL.Record.pack(APP,a,capsOf(a)),'Field Record copied, with photos');
  if(act==='cancelinsp'){insp=null;view='asset';render()}
  if(act==='saveinsp')saveInspection();
  if(act==='measure'){insp.note=$('#inote')?.value||insp.note;openMeasure()}
  if(act==='backinsp'){view='inspect';render()}
  if(act==='clearpts'){meas.pts=[];meas.from='';render()}
  if(act==='savemeas'){const v=mval();if(v==null){toast('Place both ends first');return}insp.meas=insp.meas.filter(m=>m.label!==meas.label);insp.meas.push({label:meas.label,mm:v,pts:meas.pts.map(p=>[...p]),mmPts:meas.pts.map(p=>SL.H.apply(insp.cap.card.H,p))});view='inspect';render();toast(`${meas.label} ${inch(v)}`)}
  if(act==='clearroute'){meta.route={};await saveMeta();render();toast('Route reset')}
  if(act==='copyrep')copy(reportText(),'Report copied');
  if(act==='copyboard')copy(SL.Card.svg(40,'DRAIN KEEPER'),'Board file copied');
  if(act==='copytags')copy(`<svg xmlns="http://www.w3.org/2000/svg" width="162mm" height="40mm" viewBox="0 0 162 40">${[201,202,203,204,205].map((i,k)=>SL.Card.tagSVG(i,'Drain Keeper').replace('<svg ',`<svg x="${k*32+1}" y="1" `)).join('')}</svg>`,'Tag sheet copied');
  if(act==='import'){try{const o=SL.Record.unpack($('#imp').value);if(o.app!==APP){toast(`That's a ${o.app} record. Open an asset and link it there.`);return}const x=o.spot;x.id=x.id.replace(/-i\w+$/,'')+'-i'+Date.now().toString(36).slice(-3);const map={};for(const c of o.caps||[]){const nid=x.id+'-'+c.id.split('-').pop();map[c.id]=nid;c.id=nid;c.spot=x.id;caps.set(nid,c);await store.put('caps',c)}x.ref=map[x.ref]||x.ref;x.hist.forEach(h=>h.cap=map[h.cap]||h.cap);assets.push(x);await saveA(x);openAsset(x.id);toast('Imported '+x.id)}catch(err){toast('That isn\'t a Field Record')}}
  if(act==='reset'){if(b.textContent!=='Tap again to reset'){b.textContent='Tap again to reset';return}for(const c of caps.values())await store.del('caps',c.id);for(const x of [...assets,...floods])await store.del('spots',x.id);await store.del('kv','dk-seeded');await store.del('kv','dk-started');caps.clear();imgCache.clear();assets=[];floods=[];started=false;render()}
});
document.addEventListener('change',async e=>{const t=e.target;if(t.closest('#sheet')||t.closest('.sl-root'))return;
  if(t.id==='filt'){filt=t.value;render()}
  if(t.dataset.route){if(t.checked)meta.route[t.dataset.route]=new Date().toISOString();else delete meta.route[t.dataset.route];await saveMeta();render()}
  if(t.id==='fi'){meta.forecast.inches=parseFloat(t.value)||0;await saveMeta();render()}
  if(t.id==='fdt'){meta.forecast.date=t.value;await saveMeta();render()}
  if(t.id==='mlab'){meas.label=t.value}
  if(t.id==='ca0'){cmp=null;cmp={asset:t.value};const a=assets.find(x=>x.id===t.value),C=capsOf(a);cmp={asset:a.id,a:C[0].id,b:C[C.length-1].id,mode:'swipe',grid:true};render()}
  if(t.id==='ca'||t.id==='cb'){cmp[t.id==='ca'?'a':'b']=t.value;render()}
});
SL.Geo.watch(g=>{if(g.err)return;const first=!me;me=g;if(first&&['map','assets','storm'].includes(view))render()});
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
(async()=>{try{await load()}catch(err){$('#view').innerHTML='<p>Could not set up the sample on this device.</p>';return}
  const h=location.hash.slice(1);if(h.startsWith('asset-')&&assets.some(a=>a.id===h.slice(6))){cur=h.slice(6);view='asset'}else if(['assets','storm','compare','report'].includes(h))view=h;render();probeTiles()})();
}
</script>
</body>
</html>
